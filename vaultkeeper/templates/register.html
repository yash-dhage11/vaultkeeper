{% extends "base.html" %}
{% block title %}Register - VaultKeeper{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-4 text-center">Create your Vault</h3>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Choose a Username</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Master Password</label>
                        <input type="password" name="password" class="form-control" required minlength="6">
                        <div class="form-text">At least 6 characters. This unlocks everything, so make it strong.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create Account</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Already have an account? <a href="{{ url_for('login') }}">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
